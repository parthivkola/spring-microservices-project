server:
  # Pinned locally so Config Server being optional/down cannot collide with gateway :8080
  port: 8081

spring:
  application:
    name: user-service

  config:
    import: "optional:configserver:http://localhost:8888"

  profiles:
    # Default to H2 so `mvn spring-boot:run` works without Docker Postgres.
    # Docker Compose sets SPRING_PROFILES_ACTIVE=docker (uses PostgreSQL).
    active: ${SPRING_PROFILES_ACTIVE:h2}

  datasource:
    url: ${DB_URL:jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Shared with api-gateway — change together (or inject from Config Server / secrets)
app:
  jwt:
    secret: ${JWT_SECRET:microservices-jwt-secret-key-32chars-min!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.microservices.user: DEBUG
