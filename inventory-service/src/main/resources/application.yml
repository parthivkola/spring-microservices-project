server:
  port: 8085

spring:
  application:
    name: inventory-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ============================================================
  # KAFKA CONSUMER — Phase 5 Async Messaging
  # ============================================================
  # JsonDeserializer converts the JSON payload into OrderCreatedEvent.
  # spring.json.trusted.packages="*" allows deserializing any package
  # (in production, restrict to your event packages only).
  # spring.json.value.default.type tells the deserializer the target class
  # when the producer did not set a type header.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: inventory-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.microservices.inventory.event.OrderCreatedEvent

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

logging:
  level:
    com.microservices.inventory: DEBUG
